name: Android arm64 Release

# 第一批顺滑优化（ux-smooth-phase1）的打包通道：只打 arm64 release APK，
# 体积最小化（单 ABI + 混淆 + debug 信息分离），产物发预发布 release。
on:
  push:
    branches: [ux-smooth-phase1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - run: flutter pub get

      # 静态检查：error 才阻断（fail fast）；warning/info 不阻断——
      # 该仓库存量 warning 有 60 个（多在未动文件），Flutter 3.44 默认把 warning
      # 当 fatal，默认跑法必挂；--no-fatal-* 后只拦真正的 error。
      - run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Build arm64-only release APK
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --obfuscate --split-debug-info=build/debug-info
          --tree-shake-icons

      - name: Publish prerelease with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ux-smooth-phase1-build-${{ github.run_number }}"
          # 单 ABI 构建产物就是 app-release.apk（不带 ABI 后缀；后缀只在
          # --split-per-abi 时出现），不要硬编码 app-arm64-v8a-release.apk。
          gh release create "$TAG" \
            --prerelease \
            --title "ux-smooth-phase1 build ${{ github.run_number }}" \
            --notes "第一批顺滑优化（ux-smooth-phase1 分支）arm64 release 包。提交：${{ github.sha }}" \
            build/app/outputs/flutter-apk/*.apk
