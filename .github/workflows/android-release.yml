name: Android arm64 Release

# 第一批顺滑优化（ux-smooth-phase1）的打包通道：只打 arm64 release APK，
# 体积最小化（单 ABI + 混淆 + debug 信息分离），产物发预发布 release。
on:
  push:
    branches: [ux-smooth-phase1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - run: flutter pub get

      # 静态检查：error 会直接阻断（fail fast），warning 不影响通过。
      # 之前 continue-on-error 让类型错误亮绿灯、拖到构建才炸，改掉。
      - run: flutter analyze --no-pub

      - name: Build arm64-only release APK
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --obfuscate --split-debug-info=build/debug-info
          --tree-shake-icons

      - name: Publish prerelease with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ux-smooth-phase1-build-${{ github.run_number }}"
          gh release create "$TAG" \
            --prerelease \
            --title "ux-smooth-phase1 build ${{ github.run_number }}" \
            --notes "第一批顺滑优化（ux-smooth-phase1 分支）arm64 release 包。提交：${{ github.sha }}" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
