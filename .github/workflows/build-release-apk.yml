name: Build Release APK

on:
  workflow_dispatch: # 手动触发: Actions 页面 → Build Release APK → Run workflow
  push:
    tags: ["v*"] # 打 tag (如 v3.16.4) 自动触发并发布 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build APK (arm64-only + 混淆去符号)
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --split-per-abi
          --obfuscate
          --split-debug-info=build/symbols

      - name: Pack debug symbols
        run: |
          cd build
          zip -r ../flutter-symbols.zip symbols
          cd ..

      - name: Upload artifact (每次运行都可下载)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter-symbols.zip

      - name: Publish GitHub Release (仅 tag 触发时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter-symbols.zip
